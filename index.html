    <body>
        <!--HEADERT-->
        <header>
            <div class="header-wrapper">
                <a href="index.html">
                    <img src="images/logotyp.svg" alt="logotyp för MJ">
                </a>
                <nav>
                    <ul>
                        <li><a href="index.html">Start</a></li>

        <!--MAIN-->

            <div class="container">
                <img src="images/header2.jpg" alt="en människa som står framför snö mitt uppe på ett fjäll med utsikt av andra fjäll">
            </div>
            <div class="slideshow-container">
                <div class="mySlides fade">
                    <div class="numbertext">1 / 3</div>
                    <img src="images/bilserie01.jpg" alt="två rosa blommor som växer på ett berg fullt av grönska med andra gröna berg i bakgrunden" style="width:100%">
                    <div class="text">TEXT</div>
                </div>
                <div class="mySlides fade">
                    <div class="numbertext">2 / 3</div>
                    <!--ÄNDRA BILD OCH ALT TEXT!!!!!!!!!!!!!!!!!!!-->
                    <img src="images/bilserie01.jpg" alt="två rosa blommor som växer på ett berg fullt av grönska med andra gröna berg i bakgrunden" style="width:100%">
                    <div class="text">TEXT</div>
                </div>
                <div class="mySlides fade">
                    <!--ÄNDRA BILD OCH ALT TEXT!!!!!!!!!!!!!!!!!!!-->
                    <div class="numbertext">3 / 3</div>
                    <img src="images/bilserie01.jpg" alt="två rosa blommor som växer på ett berg fullt av grönska med andra gröna berg i bakgrunden" style="width:100%">
                    <div class="text">TEXT</div>
                </div>
                <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
                <a class="next" onclick="plusSlides(1)">&#10095;</a>
            </div>
            <br>
            <div style="text-align: center">
                <span class="dot" onclick="currentSlide(1)"></span>
                <span class="dot" onclick="currentSlide(2)"></span>
                <span class="dot" onclick="currentSlide(3)"></span>
            </div>
        </main>
